<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Notes — Sharannyaa Singh</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet"><style>:root{--wine:#741526;--cream:#f6ead8;--paper:#fff8ee;--pink:#d7a1a5;--ink:#26171a;--muted:#705b5e;--line:rgba(38,23,26,.18)}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:'DM Sans',sans-serif}.page{max-width:1200px;margin:auto;padding:55px 7vw}.back,.tag,.date{font:500 10px 'DM Mono';letter-spacing:.1em;text-transform:uppercase;color:var(--wine)}.back{text-decoration:none}.head{display:flex;justify-content:space-between;align-items:end;gap:30px;border-bottom:2px solid var(--wine);padding:70px 0 35px}.head h1{font:500 clamp(55px,9vw,120px)/.85 'Playfair Display';letter-spacing:-.05em;margin:0}.head p{max-width:330px;color:var(--muted);line-height:1.6}.posts{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:35px}.post{background:var(--paper);border:1px solid var(--line);padding:32px}.post h2{font:500 38px/1.05 'Playfair Display';margin:25px 0 15px}.post p{color:var(--muted);line-height:1.7}.post .date{margin-top:25px;color:var(--wine)}@media(max-width:700px){.head{display:block}.posts{grid-template-columns:1fr}.page{padding:35px 6vw}}</style></head><body><div class="page"><a class="back" href="index.html">← Back to portfolio</a><header class="head"><h1>Daily<br>Notes.</h1><p>Easy, useful explainers connecting finance, investing and marketing — written to make complicated ideas feel less complicated.</p></header><main class="posts" id="posts"></main></div><script>fetch('blogs.json').then(r=>r.json()).then(posts=>{document.getElementById('posts').innerHTML=posts.map(p=>`<article class="post"><div class="tag">${p.category}</div><h2>${p.title}</h2><p>${p.content}</p><div class="date">${p.date}</div></article>`).join('')})</script></body></html>
